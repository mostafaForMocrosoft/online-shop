{% extends 'base.html' %}

{% block body %}

    <div>
        <section style="border: 1px solid black; width: 250px">
            <table style="border: 1px solid black;">
                <thead>
                <tr>
                    <th>نام محصول</th>
                    <th>قیمت</th>
                    <th>تعداد</th>
                </tr>
                </thead>

                <tbody>
                {% for cart_item in cart.cart_items %}
                    <tr>
                        <td>{{ cart_item.product.name }}</td>
                        <td>{{ cart_item.price }}</td>
                        <td>{{ cart_item.quantity }}</td>
                    </tr>
                {% endfor %}

                </tbody>
            </table>

            <article>
                قیمت کل: {{ cart.total_price() }}
            </article>

            <a href="/payment/{{ cart.id }}">پرداخت</a>
        </section>
    </div>
{% endblock %}
